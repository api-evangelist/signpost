aid: signpost
name: Signpost
description: 'Signpost provides AI-powered and live virtual receptionist and answering
  services for small businesses, with a focus on home-services contractors such as
  HVAC, plumbing, electrical, and roofing companies. The platform captures and responds
  to inbound calls, texts, and messages across phone, text, Angi, Thumbtack, and Facebook,
  unifies every conversation in a single messaging inbox, and integrates with CRM and
  scheduling systems so businesses never miss a lead. Signpost is backed by GV (Google
  Ventures). As of this profile it publishes no public developer API surface; this
  company record captures its identity, security posture, and compliance program.'
